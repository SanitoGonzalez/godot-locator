[project]
name = "godot-locator-cli"
version = "0.1.0"
description = "CLI program bridging AI agents to a running Godot game via the godot-locator runtime plugin."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sanito Gonzalez" }]
keywords = ["cli", "godot", "llm", "ui-automation", "playwright"]

dependencies = [
    "click>=8.1",
    "godot-locator-core>=0.1.0,<0.2.0",
]

[project.scripts]
godot-locator-cli = "godot_locator_cli.cli:main"

[project.urls]
Homepage = "https://github.com/SanitoGonzalez/godot-locator"
Repository = "https://github.com/SanitoGonzalez/godot-locator"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/godot_locator_cli"]

[tool.uv.sources]
godot-locator-core = { workspace = true }
