[project]
name = "godot-locator-mcp"
version = "0.1.0"
description = "MCP server bridging AI agents to a running Godot game via the godot-locator runtime plugin."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sanito Gonzalez" }]
keywords = ["mcp", "godot", "llm", "ui-automation", "playwright"]

dependencies = [
    "fastmcp>=3.0",
    "godot-locator-client",
    "websockets>=13",
]

[project.scripts]
godot-locator-mcp = "godot_locator_mcp.server:main"

[project.urls]
Homepage = "https://github.com/SanitoGonzalez/godot-locator"
Repository = "https://github.com/SanitoGonzalez/godot-locator"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/godot_locator_mcp"]

[tool.uv.sources]
godot-locator-client = { workspace = true }
